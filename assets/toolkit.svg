<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Engineering toolkit">
  <defs>
    <style><![CDATA[
      .bg{fill:#000}.fg{fill:#F5F1EA}.muted{fill:#8A8A8A}.copper{fill:#B87333}.rule{stroke:#1A1A1A;stroke-width:1}
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em}
      .serif{font-family:'EB Garamond','Cormorant Garamond',Georgia,serif}
    ]]></style>
  </defs>
  <rect class="bg" width="1200" height="500"/>
  <text class="mono muted" x="50" y="48" font-size="11">/ 005 · ENGINEERING TOOLKIT</text>
  <line x1="50" y1="64" x2="190" y2="64" stroke="#B87333" stroke-width="1.5"/>
  <text class="mono muted" x="1150" y="48" font-size="9" text-anchor="end">PRODUCT · PLATFORM · REALTIME</text>

  <g transform="translate(50,100)">
