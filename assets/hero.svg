<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Arjun PJ — Full-stack Engineer">
  <defs>
    <style><![CDATA[
      .bg{fill:#000}.fg{fill:#F5F1EA}.muted{fill:#8A8A8A}.copper{fill:#B87333}
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em}
      .serif{font-family:'EB Garamond','Cormorant Garamond','Playfair Display',Georgia,serif}
      .glyph{fill:#141414;font-family:'EB Garamond',Georgia,serif;font-style:italic}
    ]]></style>
  </defs>
  <rect class="bg" width="1200" height="360"/>
  <g>
    <g><text class="glyph" x="90" y="290" font-size="260">Σ</text><animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="9s" repeatCount="indefinite"/></g>
    <g><text class="glyph" x="990" y="150" font-size="170">π</text><animateTransform attributeName="transform" type="translate" values="0,0;0,7;0,0" dur="11s" repeatCount="indefinite"/></g>
    <g><text class="glyph" x="740" y="330" font-size="130">∫</text><animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="13s" repeatCount="indefinite"/></g>
    <g><text class="glyph" x="1080" y="310" font-size="100">∂</text><animateTransform attributeName="transform" type="translate" values="0,0;0,5;0,0" dur="10s" repeatCount="indefinite"/></g>
    <g><text class="glyph" x="450" y="110" font-size="90">λ</text><animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="12s" repeatCount="indefinite"/></g>
    <g><text class="glyph" x="330" y="330" font-size="70">φ</text><animateTransform attributeName="transform" type="translate" values="0,0;0,4;0,0" dur="14s" repeatCount="indefinite"/></g>
  </g>
  <g opacity="1" transform="translate(80,120)">
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.15s" fill="freeze"/>
    <text class="serif fg" x="0" y="90" font-size="140" font-style="italic" font-weight="400">APJ</text>
    <line x1="4" y1="120" x2="180" y2="120" stroke="#B87333" stroke-width="1.5" stroke-dasharray="176" stroke-dashoffset="176"><animate attributeName="stroke-dashoffset" from="176" to="0" dur="1.4s" begin="0.6s" fill="freeze"/></line>
    <text class="mono muted" x="4" y="150" font-size="11">FULL–STACK ENGINEER</text>
  </g>
  <g transform="translate(430,150)">
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.5s" fill="freeze"/><text class="mono copper" x="0" y="-8" font-size="10">— PRINCIPLE</text></g>
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.9s" fill="freeze"/><text class="serif fg" x="0" y="46" font-size="44" font-style="italic">I understand the problem</text></g>
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="1.5s" fill="freeze"/><text class="serif fg" x="0" y="104" font-size="44" font-style="italic">before I build.</text><line x1="0" y1="118" x2="330" y2="118" stroke="#B87333" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330"><animate attributeName="stroke-dashoffset" from="330" to="0" dur="1.9s" begin="2.1s" fill="freeze"/></line></g>
    <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.6s" fill="freeze"/><text class="mono muted" x="0" y="150" font-size="10">— ARJUN PJ · KERALA, INDIA</text></g>
  </g>
  <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.8s" fill="freeze"/><text class="mono muted" x="1120" y="40" font-size="9" text-anchor="end">001 · PROFILE</text><text class="mono muted" x="1120" y="336" font-size="9" text-anchor="end">IMMINIQ · ARNI</text></g>
</svg>
