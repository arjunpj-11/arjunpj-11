<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1260" role="img" aria-label="Arjun PJ profile card">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B87333"/>
      <stop offset="100%" stop-color="#E0A064"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style><![CDATA[
      .bg { fill:url(#cardBg); }
      .panel { fill:#0C0C0C; stroke:#252525; stroke-width:1.5; }
      .panel2 { fill:#080808; stroke:#202020; stroke-width:1.5; }
      .fg { fill:#F5F1EA; }
      .muted { fill:#8A8A8A; }
      .accent { fill:#B87333; }
      .mono { font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace; }
      .serif { font-family:'EB Garamond','Cormorant Garamond','Playfair Display',Georgia,serif; }
      .meta { font-size:12px; letter-spacing:.23em; }
      .label { font-size:17px; letter-spacing:.22em; }
      .body { font-size:18px; }
      .small { font-size:15px; }
      .project { font-size:31px; letter-spacing:.10em; }
    ]]></style>
  </defs>

  <rect width="1200" height="1260" fill="#050505"/>
  <rect x="32" y="26" width="1136" height="1208" rx="34" class="bg" stroke="#202020" stroke-width="2" filter="url(#shadow)"/>

  <!-- subtle animated orbit -->
  <circle cx="1030" cy="145" r="128" fill="#0D0D0D"/>
  <circle cx="1030" cy="145" r="128" fill="none" stroke="#B87333" stroke-width="1.2" stroke-dasharray="12 17" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 1030 145" to="360 1030 145" dur="34s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="17" r="6" fill="#B87333">
    <animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- metadata -->
  <g>
    <text x="78" y="83" class="mono muted meta">001 · PROFILE</text>
    <text x="1120" y="83" text-anchor="end" class="mono muted meta">ARJUN PJ · KERALA, INDIA</text>
  </g>

  <!-- hero -->
  <g transform="translate(78,144)">
    <text x="0" y="78" class="serif fg" font-size="104" font-style="italic">APJ</text>
    <line x1="2" y1="98" x2="230" y2="98" stroke="url(#copper)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="228" stroke-dashoffset="228">
      <animate attributeName="stroke-dashoffset" from="228" to="0" dur="1.4s" begin="0.65s" fill="freeze"/>
    </line>
    <text x="3" y="132" class="mono muted" font-size="14" letter-spacing=".18em">FULL–STACK ENGINEER</text>
  </g>

  <g transform="translate(380,142)">
    <text x="0" y="0" class="mono accent meta">— PRINCIPLE</text>
    <text x="0" y="65" class="serif fg" font-size="49" font-style="italic">I understand the problem</text>
    <text x="0" y="123" class="serif fg" font-size="49" font-style="italic">before I build.</text>
    <line x1="0" y1="141" x2="388" y2="141" stroke="url(#copper)" stroke-width="3" stroke-linecap="round" stroke-dasharray="388" stroke-dashoffset="388">
      <animate attributeName="stroke-dashoffset" from="388" to="0" dur="1.7s" begin="1.15s" fill="freeze"/>
    </line>
    <text x="0" y="184" class="mono muted" font-size="13" letter-spacing=".12em">ARCHITECTURE · SECURITY · REALTIME · PRODUCT SYSTEMS</text>
  </g>

  <g>
    <text x="78" y="385" class="mono fg body">I build end-to-end products where architecture, security, business rules, and user experience</text>
    <text x="78" y="417" class="mono fg body">work together as one system — not as isolated features.</text>
  </g>

  <!-- current focus -->
  <g>
    <rect x="70" y="465" width="1060" height="205" rx="24" class="panel"/>
    <text x="100" y="515" class="mono accent label">CURRENT FOCUS</text>
    <line x1="100" y1="530" x2="302" y2="530" stroke="url(#copper)" stroke-width="1.7"/>

    <circle cx="108" cy="565" r="4.5" fill="#B87333"/>
    <text x="132" y="572" class="mono fg body">Building Imminiq — structured, contextual, collaborative learning.</text>

    <circle cx="108" cy="610" r="4.5" fill="#B87333"/>
    <text x="132" y="617" class="mono fg body">Engineering clean architecture, queues, secure authentication, and real-time workflows.</text>

    <circle cx="108" cy="655" r="4.5" fill="#B87333"/>
    <text x="132" y="662" class="mono fg body">Maintaining two focused portfolio projects: Imminiq and Arni.</text>
  </g>

  <!-- selected work -->
  <g>
    <text x="78" y="735" class="mono accent label">SELECTED WORK</text>
    <line x1="78" y1="750" x2="282" y2="750" stroke="url(#copper)" stroke-width="1.7"/>

    <!-- Imminiq -->
    <rect x="70" y="780" width="510" height="370" rx="24" class="panel2"/>
    <rect x="94" y="806" width="90" height="30" rx="15" fill="#17110B" stroke="#3A2511"/>
    <text x="139" y="826" text-anchor="middle" class="mono accent" font-size="12" letter-spacing=".16em">ACTIVE</text>
    <text x="94" y="880" class="mono fg project">IMMINIQ</text>
    <text x="94" y="918" class="mono muted small">Community-evolving learning platform for structured,</text>
    <text x="94" y="944" class="mono muted small">contextual, and collaborative self-learning.</text>

    <text x="94" y="990" class="mono fg" font-size="14">• Roadmaps, lessons, contextual AI, progress insights</text>
    <text x="94" y="1019" class="mono fg" font-size="14">• Public tracker sharing and real-time messaging</text>
    <text x="94" y="1048" class="mono fg" font-size="14">• Audio/video calls and browser code execution</text>
    <text x="94" y="1077" class="mono fg" font-size="14">• Redis sessions and BullMQ background processing</text>

    <text x="94" y="1115" class="mono accent" font-size="12.5">React · TypeScript · Express · MongoDB · Redis</text>
    <text x="94" y="1138" class="mono accent" font-size="12.5">Socket.IO · WebRTC · BullMQ · Turborepo · LLM APIs</text>

    <!-- Arni -->
    <rect x="620" y="780" width="510" height="370" rx="24" class="panel2"/>
    <rect x="644" y="806" width="118" height="30" rx="15" fill="#111111" stroke="#303030"/>
    <text x="703" y="826" text-anchor="middle" class="mono fg" font-size="12" letter-spacing=".16em">COMPLETE</text>
    <text x="644" y="880" class="mono fg project">ARNI</text>
    <text x="644" y="918" class="mono muted small">My first complete full-stack product and the project that</text>
    <text x="644" y="944" class="mono muted small">taught me transaction systems end to end.</text>

    <text x="644" y="990" class="mono fg" font-size="14">• Product discovery, search, cart, and addresses</text>
    <text x="644" y="1019" class="mono fg" font-size="14">• Coupons, Razorpay payments, and order tracking</text>
    <text x="644" y="1048" class="mono fg" font-size="14">• Cancellations, returns, wallets, and inventory</text>
    <text x="644" y="1077" class="mono fg" font-size="14">• Admin workflows for orders and sales insights</text>

    <text x="644" y="1115" class="mono accent" font-size="12.5">Node.js · Express.js · MongoDB · EJS · Razorpay</text>
    <text x="644" y="1138" class="mono accent" font-size="12.5">Session Authentication · MVC-style Architecture</text>
  </g>

  <!-- contribution bridge -->
  <g>
    <text x="78" y="1205" class="mono accent label">CONTRIBUTIONS</text>
    <line x1="78" y1="1220" x2="276" y2="1220" stroke="url(#copper)" stroke-width="1.7"/>
    <text x="1115" y="1205" text-anchor="end" class="mono muted" font-size="13" letter-spacing=".10em">LIVE ANIMATION BELOW</text>
  </g>
</svg>
