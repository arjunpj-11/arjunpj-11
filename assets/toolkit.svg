    <g opacity="1" transform="translate(384,208)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".54s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">08</text><text class="serif fg" x="54" y="18" font-size="22">WebRTC</text><text class="mono muted" x="54" y="42" font-size="9">P2P · AUDIO · VIDEO</text></g>
