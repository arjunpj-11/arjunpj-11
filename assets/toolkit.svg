    <g opacity="1" transform="translate(18,300)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".68s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">10</text><text class="serif fg" x="54" y="18" font-size="22">Razorpay</text><text class="mono muted" x="54" y="42" font-size="9">PAYMENTS · ORDER STATE</text></g>
    <g opacity="1" transform="translate(384,300)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".75s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">11</text><text class="serif fg" x="54" y="18" font-size="22">Piston</text><text class="mono muted" x="54" y="42" font-size="9">IN-BROWSER CODE EXECUTION</text></g>
    <g opacity="1" transform="translate(751,300)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".82s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">12</text><text class="serif fg" x="54" y="18" font-size="22">LLM APIs</text><text class="mono muted" x="54" y="42" font-size="9">CONTEXTUAL AI · ROADMAPS</text></g>
