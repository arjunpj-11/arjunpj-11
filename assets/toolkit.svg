    <line class="rule" x1="366" y1="0" x2="366" y2="368"/><line class="rule" x1="733" y1="0" x2="733" y2="368"/>

    <g opacity="1" transform="translate(18,24)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".05s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">01</text><text class="serif fg" x="54" y="18" font-size="22">React + Vite</text><text class="mono muted" x="54" y="42" font-size="9">UI · CLIENT ARCHITECTURE</text></g>
    <g opacity="1" transform="translate(384,24)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".12s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">02</text><text class="serif fg" x="54" y="18" font-size="22">TypeScript</text><text class="mono muted" x="54" y="42" font-size="9">TYPES · CONTRACTS · SAFETY</text></g>
    <g opacity="1" transform="translate(751,24)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".19s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">03</text><text class="serif fg" x="54" y="18" font-size="22">Node + Express</text><text class="mono muted" x="54" y="42" font-size="9">APIS · SERVICES · AUTH</text></g>

    <g opacity="1" transform="translate(18,116)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".26s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">04</text><text class="serif fg" x="54" y="18" font-size="22">MongoDB</text><text class="mono muted" x="54" y="42" font-size="9">MODELING · AGGREGATION</text></g>
    <g opacity="1" transform="translate(384,116)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".33s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">05</text><text class="serif fg" x="54" y="18" font-size="22">Redis</text><text class="mono muted" x="54" y="42" font-size="9">SESSIONS · CACHE · PUBSUB</text></g>
    <g opacity="1" transform="translate(751,116)"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".40s" fill="freeze"/><text class="mono copper" x="0" y="16" font-size="11">06</text><text class="serif fg" x="54" y="18" font-size="22">BullMQ</text><text class="mono muted" x="54" y="42" font-size="9">QUEUES · WORKERS · RETRIES</text></g>

