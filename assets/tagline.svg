<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 84" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mathematics to logic to software">
  <defs>
    <style><![CDATA[
      .bg{fill:#000}.fg{fill:#F5F1EA}.copper{fill:#B87333}.muted{fill:#8A8A8A}
      .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em}
    ]]></style>
    <clipPath id="reveal"><rect x="0" y="0" width="760" height="84"><animate attributeName="width" values="0;760" dur="2.7s" begin="0.2s" fill="freeze"/></rect></clipPath>
